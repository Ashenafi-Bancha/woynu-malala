<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040303" />
    <title>Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined.</title>
    <meta
      name="description"
      content="Woynu Malala Cultural Cloth Design and Decor presents Wolaita cultural clothing and contemporary fashion — heritage craftsmanship reimagined for today."
    />
    <link rel="canonical" href="https://woynu-malala.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woynu Malala Cultural Cloth Design and Decor" />
    <meta property="og:title" content="Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined." />
    <meta
      property="og:description"
      content="Traditional Wolaita identity transformed into contemporary fashion."
    />
    <meta property="og:url" content="https://woynu-malala.vercel.app/" />
    <meta property="og:image" content="https://woynu-malala.vercel.app/logo-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined." />
    <meta
      name="twitter:description"
      content="Traditional Wolaita identity transformed into contemporary fashion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a fallback face, then swaps. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Noto+Sans+Ethiopic:wght@300;400;500;600&family=Noto+Serif+Ethiopic:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <!--
        Static copy of the home hero text. It is painted as soon as the HTML and CSS arrive,
        before any JavaScript, and React replaces it in place. Keep the classes in step with
        src/components/Hero.tsx and BrandName.tsx.
      -->
      <section class="relative flex min-h-[100svh] flex-col overflow-hidden bg-ink lg:block">
        <!-- Zone 1: space for the 3D cloth -->
        <div class="relative mt-16 h-[30svh] shrink-0 lg:absolute lg:inset-0 lg:mt-0 lg:h-auto"></div>
        <div class="relative mx-auto flex w-full max-w-[1600px] flex-1 flex-col px-5 pb-6 pt-3 md:px-12 lg:grid lg:min-h-[100svh] lg:grid-cols-[1.15fr_1fr] lg:items-center lg:gap-16 lg:pb-16 lg:pt-28">
          <div class="relative z-[4] flex flex-1 flex-col lg:block">
            <div class="flex flex-1 flex-col items-center text-center lg:items-start lg:text-left">
              <p class="text-[11px] uppercase tracking-[0.42em] text-gold">Wolaita Sodo · Ethiopia</p>
              <div class="mt-4 lg:mt-6">
                <h1 class="inline-flex flex-col items-center text-center lg:items-start lg:text-left">
                  <span class="block font-display font-bold italic leading-[0.88] tracking-[-0.01em] text-ivory whitespace-nowrap text-[13.5vw] sm:text-[13vw] lg:text-[7.4vw] 2xl:text-[8.5rem]">Woynu Malala</span>
                  <span class="block font-sans font-normal uppercase leading-snug text-gold mt-3 text-[2.9vw] sm:text-sm lg:mt-5 lg:text-base tracking-[0.36em]">Cultural Cloth Design and Decor</span>
                </h1>
              </div>
              <div class="gold-rule mt-6 w-40 lg:mt-8"></div>
              <!-- Invisible placeholders: they reserve the space of the lines React fades in -->
              <p lang="am" aria-hidden="true" class="opacity-0 mt-5 font-ethiopic text-2xl font-semibold leading-snug text-gold sm:text-3xl md:text-4xl lg:mt-6">ወይኑ ማላላ — ባህላችንን በውበት!</p>
              <p aria-hidden="true" class="opacity-0 mt-3 max-w-lg font-serif text-xl italic leading-snug text-ivory/80 md:text-2xl lg:mt-4">Traditional Wolaita identity transformed into contemporary fashion.</p>
              <div aria-hidden="true" class="opacity-0 mt-auto grid w-full grid-cols-2 gap-3 pt-7 lg:mt-10 lg:flex lg:w-auto lg:pt-0">
                <span class="inline-flex min-h-11 items-center justify-center text-center border border-gold bg-gold px-7 py-3 text-[11px] uppercase tracking-[0.28em] text-ink max-lg:px-2 max-lg:tracking-[0.14em]">View Collections</span>
                <span class="inline-flex min-h-11 items-center justify-center text-center border border-ivory/35 bg-transparent px-7 py-3 text-[11px] uppercase tracking-[0.28em] text-ivory max-lg:px-2 max-lg:tracking-[0.14em]">Contact / Order</span>
              </div>
              <div aria-hidden="true" class="opacity-0 mt-5 flex flex-col items-center gap-2 lg:mt-12 lg:flex-row lg:gap-4">
                <span class="scroll-cue"></span>
                <span class="text-[10px] uppercase tracking-[0.34em] text-ivory/60">Scroll to explore</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module">
      // The stylesheet is imported here so it is linked in <head> and styles the static hero.
      import '/src/index.css'

      // The static hero above is painted first; the app starts one frame later.
      // (The timeout covers background tabs, where animation frames do not fire.)
      let started = false
      const start = () => {
        if (started) return
        started = true
        import('/src/main.tsx')
      }
      requestAnimationFrame(() => setTimeout(start, 0))
      setTimeout(start, 400)
    </script>
  </body>
</html>
