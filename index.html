<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040303" />
    <title>Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined.</title>
    <meta
      name="description"
      content="Woynu Malala Cultural Cloth Design and Decor presents Wolaita cultural clothing and contemporary fashion — heritage craftsmanship reimagined for today."
    />
    <link rel="canonical" href="https://woynu-malala.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woynu Malala Cultural Cloth Design and Decor" />
    <meta property="og:title" content="Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined." />
    <meta
      property="og:description"
      content="Traditional Wolaita identity transformed into contemporary fashion."
    />
    <meta property="og:url" content="https://woynu-malala.vercel.app/" />
    <meta property="og:image" content="https://woynu-malala.vercel.app/logo-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Woynu Malala Cultural Cloth Design and Decor | Wolaita Heritage. Reimagined." />
    <meta
      name="twitter:description"
      content="Traditional Wolaita identity transformed into contemporary fashion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a fallback face, then swaps. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Noto+Sans+Ethiopic:wght@300;400;500;600&family=Noto+Serif+Ethiopic:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <!--
        Static copy of the home hero text. It is painted as soon as the HTML and CSS arrive,
        before any JavaScript, and React replaces it in place. Keep the classes in step with
        src/components/Hero.tsx and BrandName.tsx.
      -->
      <section class="relative min-h-[100svh] overflow-hidden bg-ink">
        <div class="relative mx-auto grid min-h-[100svh] max-w-[1600px] items-center gap-12 px-5 pb-16 pt-28 md:px-12 lg:grid-cols-[1.15fr_1fr] lg:gap-16">
          <div class="relative z-[4] lg:order-1">
            <div class="flex flex-col items-center text-center lg:items-start lg:text-left">
              <p class="text-[11px] uppercase tracking-[0.42em] text-gold">Wolaita Sodo · Ethiopia</p>
              <div class="mt-6">
                <h1 class="inline-flex flex-col items-center text-center lg:items-start lg:text-left">
                  <span class="block font-display font-bold italic leading-[0.88] tracking-[-0.01em] text-ivory text-[17vw] sm:text-[13vw] lg:text-[7.4vw] 2xl:text-[8.5rem]">Woynu Malala</span>
                  <span class="block font-sans font-normal uppercase leading-snug text-gold mt-5 text-[2.9vw] sm:text-sm lg:text-base tracking-[0.36em]">Cultural Cloth Design and Decor</span>
                </h1>
              </div>
              <div class="gold-rule mt-8 w-40"></div>
              <!-- Invisible placeholders: they reserve the space of the lines React fades in -->
              <div class="opacity-0" aria-hidden="true">
                <p lang="am" class="mt-6 font-ethiopic text-2xl font-semibold leading-snug text-gold sm:text-3xl md:text-4xl">ወይኑ ማላላ — ባህላችንን በውበት!</p>
                <p class="mt-4 max-w-lg font-serif text-xl italic leading-snug text-ivory/80 md:text-2xl">Traditional Wolaita identity transformed into contemporary fashion.</p>
                <div class="mt-10 flex flex-wrap justify-center gap-3 lg:justify-start">
                  <span class="inline-flex min-h-11 items-center justify-center text-center border border-gold bg-gold px-7 py-3 text-[11px] uppercase tracking-[0.28em] text-ink">View Collections</span>
                  <span class="inline-flex min-h-11 items-center justify-center text-center border border-ivory/35 bg-transparent px-7 py-3 text-[11px] uppercase tracking-[0.28em] text-ivory">Contact / Order</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
